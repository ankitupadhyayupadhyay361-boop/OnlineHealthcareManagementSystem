```properties
# ==========================================
# MediCare - Database Configuration
# ==========================================

# MySQL Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL Username
spring.datasource.username=root

# MySQL Password
spring.datasource.password=11111111



# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in terminal
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Server Configuration
# ==========================================

# Spring Boot server port
server.port=8080
```
