```properties
# ==========================================
# MediCare - Database Configuration
# ==========================================

# MySQL Database URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# MySQL Username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# MySQL Password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:11111111}



# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in terminal
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Server Configuration
# ==========================================

# Spring Boot server port
server.port=${PORT:8080}
```
