<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MediCare</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo h1 {
            margin: 0;
            color: #2563eb;
            font-size: 32px;
        }

        .login-logo p {
            margin-top: 8px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <h1>🏥 MediCare</h1>

                <p>Healthcare Management System</p>

            </div>


            <div id="message" class="message"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    Login

                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    /*
     * LOCALHOST BACKEND
     *
     * Spring Boot backend:
     * http://localhost:8080
     */

    const API_URL =
        "http://localhost:8080/api/users/login";


    const loginForm =
        document.getElementById("loginForm");


    const loginButton =
        document.getElementById("loginButton");


    const message =
        document.getElementById("message");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const rememberMe =
                document
                    .getElementById("rememberMe")
                    .checked;


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(API_URL, {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    });


                if (!response.ok) {

                    throw new Error(
                        "Invalid email or password"
                    );

                }


                const user =
                    await response.json();


                console.log(
                    "Logged in user:",
                    user
                );


                /*
                 * User information browser
                 * ke localStorage me save karenge.
                 */

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(user)
                );


                if (rememberMe) {

                    localStorage.setItem(
                        "rememberMe",
                        "true"
                    );

                } else {

                    localStorage.removeItem(
                        "rememberMe"
                    );

                }


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                /*
                 * Role ko uppercase me convert
                 * kar rahe hain.
                 *
                 * Isse ADMIN / admin / Admin
                 * tino properly work karenge.
                 */

                const role =
                    String(user.role || "")
                        .trim()
                        .toUpperCase();


                console.log(
                    "User Role:",
                    role
                );


                setTimeout(function() {


                    if (role === "ADMIN") {

                        window.location.href =
                            "admin.html";

                    }

                    else if (role === "DOCTOR") {

                        window.location.href =
                            "doctor.html";

                    }

                    else if (role === "PATIENT") {

                        window.location.href =
                            "patient.html";

                    }

                    else {

                        alert(
                            "Unknown user role: " +
                            role
                        );

                        window.location.href =
                            "index.html";

                    }


                }, 1000);


            }

            catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                showMessage(
                    "Invalid email or password.",
                    "error"
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>

</body>

</html>
